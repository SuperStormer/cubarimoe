name: cubari
services:
  web:
    build:
      context: ../
      # Note that this is based on the context dir
      # (Mostly) everything else is based off the
      # compose file's dir
      dockerfile: ./docker/Dockerfile
    container_name: cubari-web
    hostname: web
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=docker.settings
    env_file:
      - .env
    depends_on:
      - memcached
      - postgres
    volumes:
      - static:/cubarimoe/static
    networks:
      - cubarimoe-intercontinental-highway
    restart: on-failure:3
  memcached:
    image: memcached:1.6-alpine
    container_name: cubari-memcached
    hostname: memcached
    entrypoint:
      - memcached
      - -m 512
    networks:
      - cubarimoe-intercontinental-highway
    restart: on-failure:3
  postgres:
    image: postgres:17-alpine
    container_name: cubari-postgres
    hostname: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=kacubarimoe
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - cubarimoe-intercontinental-highway
    restart: on-failure:3
  nginx:
    image: nginx:alpine-slim
    container_name: cubari-nginx
    depends_on:
      - web
    volumes:
      - type: bind
        source: ./web.conf
        target: /etc/nginx/conf.d/default.conf
      - static:/static
    ports:
      - 80:80 # You might have to change this to just 80 if it doesn't bind properly
    networks:
      - cubarimoe-intercontinental-highway
    restart: on-failure:3
volumes:
  pgdata:
  static:
networks:
  cubarimoe-intercontinental-highway:
    name: cubarimoe-intercontinental-highway
